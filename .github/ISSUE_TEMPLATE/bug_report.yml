name: Bug report
description: Report something in an AppNav package that does not work as documented or as you would reasonably expect.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities privately instead, at https://github.com/AdamEssenmacher/AppNav/security/advisories/new.
  - type: input
    id: package
    attributes:
      label: Package and version
      description: The AppNav package and its exact version, or the commit if you built from source.
      placeholder: AdamE.AppNav x.y.z
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and target framework
      description: The operating system and version you ran on, and the target framework your app builds for.
      placeholder: Windows 11, net11.0
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the full exception and stack trace if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code or project that shows the problem, as a snippet or a link to a repository.
    validations:
      required: true
